[package]
name = "kerbdiag"
version = "0.1.0"
edition = "2021"
description = "Offline Kerberos cross-realm authentication failure explorer"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
