[package]
name = "meshdesk"
version = "0.1.0"
edition = "2021"
description = "网格修复证据台: triangle mesh review, evidence and repair proposals"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 2
