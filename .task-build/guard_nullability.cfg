<?xml version="1.0"?>
<def format="2">
  <function name="ready">
    <pure/>
    <arg nr="1" direction="in"><not-null-when result="true"/></arg>
  </function>
  <function name="failed">
    <pure/>
    <arg nr="1" direction="in"><not-null-when result="false"/></arg>
  </function>
  <function name="ready2">
    <pure/>
    <arg nr="1" direction="in"><not-null-when result="true"/></arg>
    <arg nr="2" direction="in"><not-null-when result="true"/></arg>
  </function>
  <function name="readyInt">
    <pure/>
    <arg nr="1" direction="in"><not-null-when result="true"/></arg>
  </function>
  <function name="observe"><pure/><arg nr="1" direction="in"/></function>
  <function name="check"><pure/><arg nr="1" direction="in"/></function>
  <function name="probe"><pure/><arg nr="1" direction="in"/></function>
</def>
