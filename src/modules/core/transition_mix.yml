schema_version: 0.2
type: transition
identifier: mix
title: Mix
version: 1
copyright: Meltytech, LLC
creator: Dan Dennedy
license: LGPLv2.1
language: en
tags:
  - Audio
description: Mix two audio tracks.
bugs:
  - Samples from the longer of the two frames are discarded.
parameters:
  - identifier: start
    title: Start
    argument: yes
    type: float
    mutable: yes
    description: >
      The mix level to apply to the second frame. Any negative value causes an
      automatic crossfade from 0 to 1.

  - identifier: end
    title: End
    type: float
    mutable: yes
    description: >
      The ending value of the mix level. Mix level will be interpolated from
      start to end over the in-out range.

  - identifier: reverse
    title: Reverse
    type: boolean
    mutable: yes
    description: >
      Set to 1 to reverse the direction of the mix.
    default: 0
    widget: checkbox

  - identifier: combine
    title: Use an alternative mixing algorithm
    description: >
      Mix using a low pass filter to prevent affecting audio levels. However,
      this may introduce slight artifacts.
      This is incompatible with start < 0.
    type: boolean
    default: 0
    mutable: yes

  - identifier: sum
    title: Mix by simply adding samples
    description: >
      The default mixing algorithm halves the sample values before adding them
      to absolutely prevent clipping. However, that affects levels. This
      algorithm simply adds samples and may clip. In many real world scenarios,
      the signals being mixed typically have headroom in their level and are
      rarely correlated and thus often will not clip. Also, one can reduce the
      gain and add a limiter on the mixed output prior to integer quantization
      to prevent clipping.
      This mode is incompatible with start < 0.
    type: boolean
    default: 0
    mutable: yes

  - identifier: sample_curve
    title: Sample Curve
    type: string
    mutable: yes
    description: >
      An animation keyframe string (for example "0=0;10~=1") that gives the
      mix level of the second frame at every audio sample position. The curve
      is evaluated at the absolute time of each sample with frame 0 at the
      transition in point, so non-linear fades are followed within a frame
      instead of being approximated by a linear ramp across the frame.
      The evaluated weight is clamped to the range 0 to 1 and the reverse
      property inverts it. This requires both audio streams to have the same
      sample rate, channel count, and sample count; it is mutually exclusive
      with sum and combine, and get_audio fails if they are combined or the
      formats differ. When not set, the start/end, sum, and combine behavior
      is unchanged.
